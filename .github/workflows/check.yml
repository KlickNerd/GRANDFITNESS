# Checks every pull request; on main it also deploys the site to Cloudflare Workers (grandfitness.ge).
#
# Deploying needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token, template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (Workers & Pages overview, right column)
# Without them the deploy step is skipped and the run stays green.
name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab: redeploy main by hand.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Pull request runs replace each other; deploys queue up instead,
# so a deploy is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run translations
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        if: env.CAN_DEPLOY == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped (no Cloudflare secrets yet)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CAN_DEPLOY != 'true'
        run: 'echo "::notice::Not deployed - add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from main."'
